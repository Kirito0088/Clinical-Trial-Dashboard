<!DOCTYPE html>

  <title>Clinical Trials Dashboard</title>

  <link rel="stylesheet" href="/src/styles/main.css"/>

            "unit": "4px"

          "fontFamily": {
            "headline-md": ["Inter"],
            "label-sm": ["Inter"],

  <!-- Sidebar Navigation -->
  <div id="sidebar-container"></div>

  <!-- Main Workspace -->
  <div class="ml-60 flex-1 flex flex-col h-screen overflow-hidden">
    <!-- Top Header -->
    <div id="header-container"></div>

    <!-- Scrollable Main Content -->
    <main class="mt-16 p-4 md:p-6 flex-1 overflow-y-auto bg-surface-base">
      <div id="main-content" class="max-w-[1440px] mx-auto w-full">
        <!-- Dynamic Page Header & Views loaded here -->
      </div>
    </main>
  </div>

  <!-- Dynamic Modal / Drawer Container -->
  <div id="modal-container"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="/src/main.js"></script>
